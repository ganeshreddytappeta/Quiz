<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background & Glow Filters -->
    <filter id="neon-glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic & Neon Gradients -->
    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0099ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="grad-magenta-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00d4" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="grad-chrome-aikyam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cde9ff" />
      <stop offset="50%" stop-color="#5bb5ff" />
      <stop offset="65%" stop-color="#144b9e" />
      <stop offset="100%" stop-color="#0a1f4a" />
    </linearGradient>

    <linearGradient id="grad-chrome-2k26" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffd5fc" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="75%" stop-color="#a21caf" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- People Unity Gradients -->
    <linearGradient id="petal-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="petal-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="petal-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="petal-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="petal-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="petal-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="450" cy="225" r="210" fill="#0284c7" opacity="0.25" filter="url(#neon-glow-cyan)" />
  <circle cx="450" cy="225" r="170" fill="#d946ef" opacity="0.22" filter="url(#neon-glow-magenta)" />

  <!-- Outer Cyber Circuit Traces (Left & Right Wings) -->
  <g stroke="#00f0ff" stroke-width="3" fill="none" opacity="0.85" filter="url(#subtle-glow)">
    <!-- Left Wing Circuits -->
    <path d="M 230 225 L 180 225 L 140 180 L 70 180" />
    <circle cx="70" cy="180" r="5" fill="#00f0ff" />
    <path d="M 245 285 L 200 320 L 120 320 L 90 350 L 50 350" />
    <circle cx="50" cy="350" r="5" fill="#00f0ff" />
    <path d="M 245 165 L 195 130 L 130 130 L 95 100 L 60 100" />
    <circle cx="60" cy="100" r="5" fill="#00f0ff" />
    
    <!-- Right Wing Circuits -->
    <path d="M 670 225 L 720 225 L 760 180 L 830 180" stroke="#d946ef" />
    <circle cx="830" cy="180" r="5" fill="#d946ef" />
    <path d="M 655 285 L 700 320 L 780 320 L 810 350 L 850 350" stroke="#d946ef" />
    <circle cx="850" cy="350" r="5" fill="#d946ef" />
    <path d="M 655 165 L 705 130 L 770 130 L 805 100 L 840 100" stroke="#d946ef" />
    <circle cx="840" cy="100" r="5" fill="#d946ef" />
  </g>

  <!-- Outer Glowing Tech Ring -->
  <circle cx="450" cy="225" r="205" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.9" filter="url(#neon-glow-cyan)" />
  <circle cx="450" cy="225" r="195" fill="#030716" stroke="url(#grad-magenta-pink)" stroke-width="3" />
  <circle cx="450" cy="225" r="145" fill="#050b24" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Segment Spoke Dividers -->
  <g stroke="rgba(0, 240, 255, 0.45)" stroke-width="2">
    <line x1="450" y1="20" x2="450" y2="80" />
    <line x1="627" y1="122" x2="575" y2="152" />
    <line x1="627" y1="327" x2="575" y2="297" />
    <line x1="450" y1="430" x2="450" y2="370" />
    <line x1="272" y1="327" x2="324" y2="297" />
    <line x1="272" y1="122" x2="324" y2="152" />
  </g>

  <!-- Circular Ring Category Icons (Film, Music, Idea, Code, Trivia, Fun) -->
  <g fill="#ffffff" filter="url(#subtle-glow)">
    <!-- Clapperboard (Top Left) -->
    <g transform="translate(370, 75) scale(0.85)">
      <rect x="0" y="8" width="34" height="24" rx="3" fill="#00f0ff" />
      <polygon points="0,0 34,0 34,7 0,7" fill="#ffffff" />
      <polygon points="4,0 9,0 5,7 0,7" fill="#050814" />
      <polygon points="14,0 19,0 15,7 10,7" fill="#050814" />
      <polygon points="24,0 29,0 25,7 20,7" fill="#050814" />
      <polygon points="8,15 22,20 8,25" fill="#050814" />
    </g>

    <!-- Music Notes (Top Right) -->
    <g transform="translate(500, 75) scale(0.9)">
      <circle cx="8" cy="24" r="5" fill="#d946ef" />
      <circle cx="26" cy="20" r="5" fill="#d946ef" />
      <rect x="11" y="8" width="3" height="16" fill="#fff" />
      <rect x="29" y="4" width="3" height="16" fill="#fff" />
      <polygon points="11,8 32,4 32,10 11,14" fill="#fff" />
    </g>

    <!-- Lightbulb / Idea (Right) -->
    <g transform="translate(575, 160) scale(0.9)">
      <path d="M16 2 C9.4 2 4 7.4 4 14 C4 18 6 21 8 23 L8 26 L24 26 L24 23 C26 21 28 18 28 14 C28 7.4 22.6 2 16 2 Z" fill="#facc15" />
      <rect x="10" y="27" width="12" height="3" rx="1" fill="#fff" />
      <rect x="12" y="31" width="8" height="2" rx="1" fill="#fff" />
    </g>

    <!-- Laptop with </ > (Bottom Right) -->
    <g transform="translate(555, 265) scale(0.9)">
      <rect x="4" y="4" width="32" height="22" rx="2" fill="#0369a1" stroke="#00f0ff" stroke-width="1.5" />
      <polygon points="0,26 40,26 38,30 2,30" fill="#cbd5e1" />
      <text x="10" y="19" fill="#00f0ff" font-family="monospace" font-weight="bold" font-size="11">&lt;/&gt;</text>
    </g>

    <!-- Trivia / Question Bulb (Bottom Left) -->
    <g transform="translate(305, 265) scale(0.9)">
      <path d="M16 2 C9.4 2 4 7.4 4 14 C4 18 6 21 8 23 L8 26 L24 26 L24 23 C26 21 28 18 28 14 C28 7.4 22.6 2 16 2 Z" fill="#0284c7" />
      <text x="12" y="18" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14">?</text>
      <rect x="11" y="27" width="10" height="3" rx="1" fill="#fff" />
    </g>

    <!-- Celebration Balloons (Left) -->
    <g transform="translate(290, 155) scale(0.9)">
      <ellipse cx="14" cy="14" rx="8" ry="11" fill="#38bdf8" />
      <polygon points="12,24 16,24 14,27" fill="#38bdf8" />
      <ellipse cx="24" cy="18" rx="7" ry="9" fill="#f43f5e" />
      <polygon points="22,26 26,26 24,29" fill="#f43f5e" />
    </g>
  </g>

  <!-- INNER CORE: Interconnected Unity Circle (Aikyam Emblem) -->
  <g transform="translate(450, 225)">
    <!-- 6 Stylized Figures Forming Unity Vortex -->
    <!-- Figure 1: Violet (Top) -->
    <g transform="rotate(0)">
      <circle cx="0" cy="-75" r="14" fill="url(#petal-violet)" filter="url(#subtle-glow)" />
      <path d="M 0 -58 C 22 -58 45 -40 55 -15 C 38 -25 18 -25 0 -45 C -18 -25 -38 -25 -55 -15 C -45 -40 -22 -58 0 -58 Z" fill="url(#petal-violet)" />
    </g>

    <!-- Figure 2: Pink/Magenta (60 deg) -->
    <g transform="rotate(60)">
      <circle cx="0" cy="-75" r="14" fill="url(#petal-pink)" filter="url(#subtle-glow)" />
      <path d="M 0 -58 C 22 -58 45 -40 55 -15 C 38 -25 18 -25 0 -45 C -18 -25 -38 -25 -55 -15 C -45 -40 -22 -58 0 -58 Z" fill="url(#petal-pink)" />
    </g>

    <!-- Figure 3: Orange (120 deg) -->
    <g transform="rotate(120)">
      <circle cx="0" cy="-75" r="14" fill="url(#petal-orange)" filter="url(#subtle-glow)" />
      <path d="M 0 -58 C 22 -58 45 -40 55 -15 C 38 -25 18 -25 0 -45 C -18 -25 -38 -25 -55 -15 C -45 -40 -22 -58 0 -58 Z" fill="url(#petal-orange)" />
    </g>

    <!-- Figure 4: Yellow (180 deg) -->
    <g transform="rotate(180)">
      <circle cx="0" cy="-75" r="14" fill="url(#petal-yellow)" filter="url(#subtle-glow)" />
      <path d="M 0 -58 C 22 -58 45 -40 55 -15 C 38 -25 18 -25 0 -45 C -18 -25 -38 -25 -55 -15 C -45 -40 -22 -58 0 -58 Z" fill="url(#petal-yellow)" />
    </g>

    <!-- Figure 5: Green (240 deg) -->
    <g transform="rotate(240)">
      <circle cx="0" cy="-75" r="14" fill="url(#petal-green)" filter="url(#subtle-glow)" />
      <path d="M 0 -58 C 22 -58 45 -40 55 -15 C 38 -25 18 -25 0 -45 C -18 -25 -38 -25 -55 -15 C -45 -40 -22 -58 0 -58 Z" fill="url(#petal-green)" />
    </g>

    <!-- Figure 6: Cyan (300 deg) -->
    <g transform="rotate(300)">
      <circle cx="0" cy="-75" r="14" fill="url(#petal-cyan)" filter="url(#subtle-glow)" />
      <path d="M 0 -58 C 22 -58 45 -40 55 -15 C 38 -25 18 -25 0 -45 C -18 -25 -38 -25 -55 -15 C -45 -40 -22 -58 0 -58 Z" fill="url(#petal-cyan)" />
    </g>

    <!-- Central Sparkling Star of Unity -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" filter="url(#neon-glow-cyan)" />
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="#ffffff" filter="url(#subtle-glow)" />
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#00f0ff" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- ================================================================= -->
  <!-- 3D BOLD CHROME TYPOGRAPHY: AIKYAM                                 -->
  <!-- ================================================================= -->
  <g id="typography-aikyam" transform="translate(450, 480)">
    
    <!-- Outer Glow Underlayer -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="124" 
          font-weight="950" 
          text-anchor="middle" 
          letter-spacing="6" 
          fill="#00f0ff" 
          opacity="0.8" 
          filter="url(#neon-glow-cyan)">
      AÎKYAM
    </text>

    <!-- Deep Bevel Shadow Underlayer -->
    <text x="3" y="8" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="124" 
          font-weight="950" 
          text-anchor="middle" 
          letter-spacing="6" 
          fill="#040b24">
      AÎKYAM
    </text>

    <!-- Chrome Metallic Front Layer -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="124" 
          font-weight="950" 
          text-anchor="middle" 
          letter-spacing="6" 
          fill="url(#grad-chrome-aikyam)" 
          stroke="#ffffff" 
          stroke-width="2.5">
      AÎKYAM
    </text>

    <!-- Diamond Accent over the I -->
    <polygon points="-78,-115 -68,-95 -78,-75 -88,-95" fill="#00f0ff" filter="url(#neon-glow-cyan)" />
    <polygon points="-78,-110 -71,-95 -78,-80 -85,-95" fill="#ffffff" />
  </g>

  <!-- ================================================================= -->
  <!-- 3D NEON TYPOGRAPHY: 2K26                                          -->
  <!-- ================================================================= -->
  <g id="typography-2k26" transform="translate(450, 560)">
    <!-- Glow Underlayer -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="78" 
          font-weight="950" 
          text-anchor="middle" 
          letter-spacing="8" 
          fill="#ff00d4" 
          opacity="0.9" 
          filter="url(#neon-glow-magenta)">
      2K26
    </text>

    <!-- Front Beveled Layer -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="78" 
          font-weight="950" 
          text-anchor="middle" 
          letter-spacing="8" 
          fill="url(#grad-chrome-2k26)" 
          stroke="#ffffff" 
          stroke-width="1.8">
      2K26
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- MOTTO: ONE PLATFORM | MANY TALENTS | ENDLESS POSSIBILITIES        -->
  <!-- ================================================================= -->
  <g transform="translate(450, 615)">
    <!-- Left Divider Line with Cyan Fade -->
    <line x1="-390" y1="0" x2="-260" y2="0" stroke="url(#grad-cyan-blue)" stroke-width="2" />
    <circle cx="-260" cy="0" r="3" fill="#00f0ff" />

    <!-- Center Motto Text -->
    <text x="0" y="4" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="14.5" 
          font-weight="800" 
          text-anchor="middle" 
          letter-spacing="4.5" 
          fill="#e2e8f0">
      ONE PLATFORM  <tspan fill="#00f0ff">|</tspan>  MANY TALENTS  <tspan fill="#ff00d4">|</tspan>  ENDLESS POSSIBILITIES
    </text>

    <!-- Right Divider Line with Magenta Fade -->
    <circle cx="260" cy="0" r="3" fill="#ff00d4" />
    <line x1="260" y1="0" x2="390" y2="0" stroke="url(#grad-magenta-pink)" stroke-width="2" />

    <!-- Diamond Accent Underneath -->
    <polygon points="0,14 6,20 0,26 -6,20" fill="#00f0ff" filter="url(#subtle-glow)" />
  </g>

</svg>
